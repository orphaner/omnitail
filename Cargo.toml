[package]
name = "omnitail"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Follow many log streams at once, in stacked panes: files, commands, docker, compose, kubernetes"
repository = "https://github.com/orphaner/omnitail"
homepage = "https://github.com/orphaner/omnitail"

[dependencies]
ansi-to-tui = "8.0.1"
anyhow = "1.0.104"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
libc = "0.2"
notify = "8.2.0"
ratatui = "0.30.2"
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1.53.3", features = ["full"] }
toml = { version = "1.1.8", features = ["preserve_order"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
