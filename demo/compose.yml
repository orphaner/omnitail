name: omnitaildemo
services:
  web:
    image: alpine:3
    command: sh -c 'i=0; while true; do i=$$((i+1)); echo "web request $$i"; sleep 0.5; done'
  db:
    image: alpine:3
    command: sh -c 'i=0; while true; do i=$$((i+1)); printf "\033[33mdb\033[0m checkpoint %s\n" $$i; sleep 1; done'

  # Access logs in the nginx "combined" format (detected as `http`).
  nginx:
    image: alpine:3
    command:
      - sh
      - -c
      - |
        while true; do
          set -- 200 200 200 201 304 404 500
          shift $$((RANDOM % 7)); code=$$1
          printf '172.18.0.%s - - [%s] "GET /api/items/%s HTTP/1.1" %s %s "-" "curl/8.5"\n' \
            $$((RANDOM % 250)) "$$(date '+%d/%b/%Y:%H:%M:%S +0000')" $$((RANDOM % 900)) $$code $$((RANDOM % 5000))
          sleep 0.7
        done

  # One JSON object per line (detected as `json`). Errors carry a Java stack
  # trace in `exception`, with escaped \n and \t (unfolded by the detail view).
  api:
    image: alpine:3
    command:
      - sh
      - -c
      - |
        while true; do
          set -- info info info debug warn error
          shift $$((RANDOM % 6)); level=$$1
          if [ $$level = error ]; then
            printf '{"time":"%s","level":"error","msg":"request failed\\r\\nuser %s gets a 500","user_id":%s,"exception":"java.lang.IllegalStateException: payment declined\\n\\tat com.example.api.PaymentService.charge(PaymentService.java:%s)\\n\\tat com.example.api.OrderController.create(OrderController.java:57)\\n\\tat jdk.internal.reflect.DirectMethodHandleAccessor.invoke(DirectMethodHandleAccessor.java:103)\\nCaused by: java.net.SocketTimeoutException: Read timed out\\n\\tat java.base/sun.nio.ch.NioSocketImpl.timedRead(NioSocketImpl.java:288)\\n\\t... 12 more","ok":false}\n' \
              "$$(date -u '+%Y-%m-%dT%H:%M:%SZ')" $$((RANDOM % 100)) $$((RANDOM % 100)) $$((RANDOM % 300 + 1))
          else
            printf '{"time":"%s","level":"%s","msg":"handled request","user_id":%s,"duration_ms":%s,"ok":true}\n' \
              "$$(date -u '+%Y-%m-%dT%H:%M:%SZ')" $$level $$((RANDOM % 100)) $$((RANDOM % 300))
          fi
          sleep 0.9
        done

  # key=value lines (detected as `logfmt`).
  worker:
    image: alpine:3
    command:
      - sh
      - -c
      - |
        while true; do
          set -- info info info warn error
          shift $$((RANDOM % 5)); level=$$1
          printf 'time=%s level=%s msg="job processed" job=%s attempt=%s duration=%sms\n' \
            "$$(date -u '+%Y-%m-%dT%H:%M:%SZ')" $$level $$((RANDOM % 1000)) $$((RANDOM % 3 + 1)) $$((RANDOM % 800))
          sleep 1.1
        done
