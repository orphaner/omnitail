  { regex = '(Ethernet|GigE|Fa|Gi|Te|Twe|Fo|Fi|Hu|TH)([0-9]+/[0-9]+(/[0-9]+|))', group = 1, style = "magenta bold" },
  { regex = '(Ethernet|GigE|Fa|Gi|Te|Twe|Fo|Fi|Hu|TH)([0-9]+/[0-9]+(/[0-9]+|))', group = 2, style = "magenta bold" },
  { regex = '(Ethernet|GigE|Fa|Gi|Te|Twe|Fo|Fi|Hu|TH)([0-9]+/[0-9]+(/[0-9]+|))', group = 3, style = "magenta bold" },
  { regex = '(Port-channel|Po)([0-9]+)', group = 1, style = "magenta bold" },
  { regex = '(Port-channel|Po)([0-9]+)', group = 2, style = "magenta bold" },
