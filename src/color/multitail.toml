[scheme.dovecot]
rules = [
  { regex = ':', style = "cyan" },
  { regex = '^... .. ..:..:..', style = "blue" },
  { regex = 'imap-login', style = "yellow bold" },
  { regex = 'pop3-login', style = "yellow bold" },
