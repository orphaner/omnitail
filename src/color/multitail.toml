  { regex = ' list [0-9]+ denied ([a-z0-9]*+).', group = 1, style = "blue bold" },
  { regex = ' list [0-9]+ permitted ([a-z0-9]*+).', group = 1, style = "blue bold" },
  { regex = '\bpermitted\b', style = "green bold" },
  { regex = '\bdenied\b', style = "red bold" },
  { regex = '\b(down|off)\b', style = "red bold" },
  { regex = '[Pp]ower\ [Ss]upply\ ([0-9])', group = 1, style = "bold" },
  { regex = '\bfaulty\b', style = "red bold" },
  { regex = 'error', style = "red bold" },
  { regex = 'high warning', style = "yellow bold" },
  { regex = 'low warning', style = "yellow bold" },
  { regex = 'low alarm', style = "red bold" },
  { regex = 'high alarm', style = "red bold" },
  { regex = 'exceeds warning level', style = "red bold" },
]

[scheme.cisco_asa]
