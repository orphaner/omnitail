  { regex = '%\S*-2-\S*', style = "red" },
  { regex = '%\S*-3-\S*', style = "red" },
  { regex = '%\S*-4-\S*', style = "yellow" },
  { regex = '%\S*-5-\S*', style = "yellow" },
  { regex = '%\S*-6-\S*', style = "green" },
  { regex = '%\S*-7-\S*', style = "black bg:white" },
  { regex = '\bforwarding\b', style = "green bold" },
  { regex = '\bblocking\b', style = "red bold" },
  { regex = '\sinstance', style = "cyan" },
  { regex = 'instance ([0-9]{1,4})', group = 1, style = "cyan bold" },
