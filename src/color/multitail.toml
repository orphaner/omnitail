[scheme.uwsgi]
description = 'https://uwsgi-docs.readthedocs.io/en/latest/'
paths = ['/var/log/uwsgi']
rules = [
  { regex = '\{[0-9]+ vars in [0-9]+ bytes\} \[.*\] (GET)', group = 1, style = "cyan" },
  { regex = '\{[0-9]+ vars in [0-9]+ bytes\} \[.*\] (POST|PUT|DELETE|OPTIONS)', group = 1, style = "magenta" },
  { regex = 'generated [0-9]+ bytes in ([0-9]+) msecs', group = 1, style = "green" },
  { regex = '\[pid: [0-9]+\|app: [0-9]+\|req: [0-9]+\/[0-9]+\].*[A-Z]+ ([^ ]+)', group = 1, style = "white underline" },
  { regex = 'generated [0-9]+ bytes in [0-9]+ msecs \(HTTP\/[0-9]+\.[0-9]+ ([0-9]+)\)', group = 1, style = "white bold" },
  { regex = '\[pid: [0-9]+\|app: [0-9]+\|req: [0-9]+\/[0-9]+\] ([0-9a-f:\.]+)', group = 1, style = "blue bold" },
  { regex = '\{[0-9]+ vars in [0-9]+ bytes\} (\[).* ([0-9]+:[0-9]+:[0-9]+) .*(\])', group = 1, style = "white bold" },
  { regex = '\{[0-9]+ vars in [0-9]+ bytes\} (\[).* ([0-9]+:[0-9]+:[0-9]+) .*(\])', group = 2, style = "white bold" },
  { regex = '\{[0-9]+ vars in [0-9]+ bytes\} (\[).* ([0-9]+:[0-9]+:[0-9]+) .*(\])', group = 3, style = "white bold" },
]
