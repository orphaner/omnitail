[scheme.syslog]
description = 'kernel and unsorted messages'
rules = [
  { regex = 'kernel: ([^:]*): segfault at [^ ]* rip [^ ]* rsp [^ ]* error', group = 1, style = "red bold" },
  { regex = 'kernel: .*: segfault at [^ ]* rip [^ ]* rsp [^ ]* error', style = "yellow" },
  { regex = 'kernel', style = "red reverse underline" },
  { regex = 'Detected.*$', style = "green" },
  { regex = '\[', style = "green" },
  { regex = '\]', style = "green" },
  { regex = ':', style = "cyan" },
  { regex = '^... .. ..:..:..', style = "blue" },
  { regex = '^... .. ..:..:.. [^ ]* ([A-z0-9]*)', group = 1, style = "bold" },
  { regex = 'scanlogd.*', style = "red" },
  { regex = 'Did.not', style = "yellow" },
]

[scheme.zarafa]
description = 'www.zarafa.com'
paths = ['/var/log/zarafa/']
rules = [
  { regex = 'none', style = "magenta" },
  { regex = 'debug', style = "blue bold" },
  { regex = 'info', style = "green bold" },
  { regex = 'notice', style = "yellow" },
  { regex = 'warning', style = "yellow bold" },
  { regex = 'error', style = "red" },
  { regex = 'fatal', style = "red bold" },
  { regex = ':', style = "yellow" },
  { regex = '^... ... .. ..:..:.. ....', style = "green" },
  { regex = '/', style = "cyan bold" },
  { regex = '\(', style = "red bold" },
  { regex = '\)', style = "red bold" },
  { regex = 'User *([^ ]*)', group = 1, style = "yellow underline" },
  { regex = ' *[a-z]*[0-9]+[a-z]*', style = "magenta bold" },
  { regex = '\[', style = "red" },
  { regex = '\]', style = "red" },
]

[scheme.weblogic]
rules = [
  { regex = '.*(<Error>).*', group = 1, style = "red bold" },
  { regex = '.*(<Warning>).*', group = 1, style = "yellow" },
  { regex = '.*(<Debug>).*', group = 1, style = "blue" },
  { regex = '.*(<.*>).*', group = 1, style = "green" },
]

[scheme.goldengate]
rules = [
  { regex = '.*( ERROR ).*', group = 1, style = "red bold" },
  { regex = '.*( WARNING ).*', group = 1, style = "yellow" },
  { regex = '.*( INFO ).*', group = 1, style = "green" },
]

[scheme.ssh]
description = 'www.openssh.org'
rules = [
  { regex = 'error: Could not get shadow information for.*', style = "yellow" },
  { regex = 'fatal: Timeout before authentication for.*', style = "yellow" },
  { regex = 'error: PAM: Authentication failure for(.*)', group = 1, style = "red bold" },
  { regex = 'error: PAM: Authentication failure for', style = "red" },
  { regex = 'error: Bind to port [0-9]* on [^ ]* failed: Address already in use.', style = "red bold" },
  { regex = 'error: PAM: Authentication failure for ([^ ]*) from (.*)', group = 1, style = "red bold" },
  { regex = 'error: PAM: Authentication failure for ([^ ]*) from (.*)', group = 2, style = "red bold" },
  { regex = 'error: PAM: Authentication failure for ([^ ]*) from (.*)', style = "red" },
  { regex = 'Accepted [^ ]* for ([^ ]*) from ([^ ]*) port ([0-9]*) ssh2', group = 1, style = "green bold" },
  { regex = 'Accepted [^ ]* for ([^ ]*) from ([^ ]*) port ([0-9]*) ssh2', group = 2, style = "green bold" },
  { regex = 'Accepted [^ ]* for ([^ ]*) from ([^ ]*) port ([0-9]*) ssh2', group = 3, style = "green bold" },
  { regex = 'Accepted [^ ]* for [^ ]* from [^ ]* port.*', style = "green" },
  { regex = 'PAM session setup failed\[[0-9]*\]:.*', style = "red" },
  { regex = 'Failed ([^ ]*) for ([^ ]*) from ([^ ]*) port ([0-9]*).*', group = 1, style = "yellow bold" },
  { regex = 'Failed ([^ ]*) for ([^ ]*) from ([^ ]*) port ([0-9]*).*', group = 2, style = "yellow bold" },
  { regex = 'Failed ([^ ]*) for ([^ ]*) from ([^ ]*) port ([0-9]*).*', group = 3, style = "yellow bold" },
  { regex = 'Failed ([^ ]*) for ([^ ]*) from ([^ ]*) port ([0-9]*).*', group = 4, style = "yellow bold" },
  { regex = 'Failed [^ ]* for [^ ]* from [^ ]* port [0-9]* .*', style = "yellow" },
  { regex = 'Disconnecting: Too many authentication failures for.*', style = "red" },
]

[scheme.powerdns]
description = 'www.powerdns.com'
rules = [
  { regex = 'Remote\ (.*)\ wants', group = 1, style = "green" },
  { regex = ''''.*'''', style = "blue" },
  { regex = 'MISS', style = "red" },
  { regex = 'HIT', style = "green bold" },
]

[scheme.logcat]
rules = [
  { regex = '^./(dalvikvm)\(', group = 1, style = "blue bold" },
  { regex = '^./(Process)\(', group = 1, style = "blue bold" },
  { regex = '^./(ActivityManager)\(', group = 1, style = "cyan" },
  { regex = '^./(ActivityThread)\(', group = 1, style = "cyan" },
  { regex = '^./([^\(]*)\(', group = 1, style = "white bold" },
  { regex = '^[^\(]*(\()[^\)]*(\))', group = 1, style = "green" },
  { regex = '^[^\(]*(\()[^\)]*(\))', group = 2, style = "green" },
  { regex = '[Pp]ermission [Dd]eni[ae][dl]', style = "red reverse" },
  { regex = 'Caused by:', style = "red reverse" },
  { regex = ':', style = "cyan" },
  { regex = '^(F)/[^:]*: (.*)$', group = 1, style = "red reverse" },
  { regex = '^(F)/[^:]*: (.*)$', group = 2, style = "red reverse" },
  { regex = '^(E)/[^:]*: (.*)$', group = 1, style = "red" },
  { regex = '^(E)/[^:]*: (.*)$', group = 2, style = "red" },
  { regex = '^(W).[^:]*: (.*)$', group = 1, style = "yellow" },
  { regex = '^(W).[^:]*: (.*)$', group = 2, style = "yellow" },
  { regex = '^(V)/[^:]*: (.*)$', group = 1, style = "green" },
  { regex = '^(V)/[^:]*: (.*)$', group = 2, style = "green" },
  { regex = '^(D)/[^:]*: (.*)$', group = 1, style = "black bold" },
  { regex = '^(D)/[^:]*: (.*)$', group = 2, style = "black bold" },
]

[scheme.liniptfw]
description = 'Linux IPtables (2.6.x kernel)'
rules = [
  { regex = ':', style = "cyan" },
  { regex = '^... .. ..:..:..', style = "blue" },
  { regex = 'kernel: .*(DPT=[0-9]*)', group = 1, style = "red" },
  { regex = 'kernel: (IN=[^ ]*)', group = 1, style = "yellow" },
  { regex = 'kernel: .*(SRC=[^ ]*) *(DST=[^ ]*)', group = 1, style = "cyan" },
  { regex = 'kernel: .*(SRC=[^ ]*) *(DST=[^ ]*)', group = 2, style = "cyan" },
  { regex = 'kernel: .*(PROTO=[^ ]*)', group = 1, style = "green" },
]

[scheme.postfix]
description = 'www.postfix.org'
paths = ['/var/log/mail/']
rules = [
  { regex = ':', style = "cyan" },
  { regex = 'status=sent', style = "yellow" },
  { regex = 'queue.active', style = "magenta" },
  { regex = 'from=.*>', style = "green" },
  { regex = 'to=.*>', style = "red" },
  { regex = '^... .. ..:..:..', style = "blue" },
  { regex = '\[', style = "green" },
  { regex = '\]', style = "green" },
]

[scheme.apache]
description = 'default Apache logging (webserver)'
paths = ['/var/log/apache/.*access', '/var/log/lighttpd/.*access']
rules = [
  { regex = '"[ ](1[0-9][0-9])[ ]', group = 1, style = "yellow" },
  { regex = '"[ ]([2-3][0-9][0-9])[ ]', group = 1, style = "green" },
  { regex = '"[ ]([4-5][0-9][0-9])[ ]', group = 1, style = "red" },
  { regex = ':', style = "cyan" },
  { regex = '\[', style = "green" },
  { regex = '\]', style = "green" },
  { regex = '^[0-9]\{1,3\}\.[0-9]\{1,3\}\.[0-9]\{1,3\}\.[0-9]\{1,3\}', style = "yellow" },
  { regex = '^[^ ]*', style = "yellow" },
]

[scheme.apache_error]
description = 'default Apache error logging'
paths = ['/var/log/apache/.*error']
rules = [
  { regex = '\[client .*\]', style = "yellow" },
  { regex = ' [^ ]*$', style = "red" },
  { regex = '^\[... ... .. ..:..:.. ....\]', style = "blue" },
]

[scheme.acctail]
description = '(BSD-) process accounting reader'
rules = [
  { regex = '^................', style = "green" },
  { regex = '^.................(....)', group = 1, style = "red" },
  { regex = '^......................(........)', group = 1, style = "cyan" },
  { regex = '^...............................(........)', group = 1, style = "yellow" },
  { regex = '\.', style = "blue" },
]

[scheme.wtmptail]
description = 'www.vanheusden.com/wtmptail/'
rules = [
  { regex = '\.', style = "blue" },
  { regex = ':', style = "blue" },
  { regex = '^USER.*', style = "yellow" },
  { regex = '^........', style = "green" },
  { regex = '[0-9]*:[0-9]*[ap]m', style = "cyan" },
  { regex = '^..................................', style = "red" },
  { regex = 'BOOT', style = "black bg:red bold" },
  { regex = 'DEAD', style = "black bg:yellow" },
]

[scheme.squid]
description = 'http proxy server'
paths = ['/var/log/squid/', '/var/log/squid3/']
rules = [
  { regex = '^[^ ]*', style = "blue" },
  { regex = '^[^ ]* *[0-9]* *([^ ]*)', group = 1, style = "yellow" },
  { regex = '^[^ ]* *[0-9]* *[^ ]* ([^ ]*)', group = 1, style = "green" },
  { regex = '^[^ ]* *[0-9]* *[^ ]* [^ ]* *[0-9]* *[^ ]* *([^ ]*)', group = 1, style = "cyan" },
]

[scheme.sendmail]
paths = ['/var/log/mail/']
rules = [
  { regex = '^...............', style = "blue" },
  { regex = 'to=<[^>]*>', style = "cyan" },
  { regex = 'stat=Deferred.*', style = "yellow" },
  { regex = 'stat=User unknown', style = "red" },
  { regex = 'stat=Sent.*', style = "green" },
  { regex = 'relay=[^ ]*', style = "magenta" },
  { regex = ':', style = "cyan" },
  { regex = 'verify=FAIL', style = "red" },
]

[scheme.mailscanner]
description = 'wrapper around sendmail/clamav/spamassassin'
rules = [
  { regex = 'Detected HTML-specific exploits in.*', style = "red" },
  { regex = 'Delivered [0-9]* warnings to virus senders', style = "magenta" },
  { regex = 'Spam Checks: Found [0-9]* spam messages', style = "yellow" },
  { regex = 'Content Checks: Detected and will disarm HTML message in.*', style = "yellow" },
  { regex = 'Uninfected: Delivered [0-9]* messages', style = "green" },
  { regex = 'Infected message [^ ]* came from.*', style = "red" },
  { regex = 'Saved infected "[^"]*" to.*', style = "yellow" },
  { regex = '^...............', style = "blue" },
  { regex = ':', style = "cyan" },
]

[scheme.spamassassin]
rules = [
  { regex = ':', style = "magenta" },
  { regex = '^... .. ..:..:..', style = "blue" },
  { regex = 'autolearn=failed', style = "yellow" },
  { regex = 'server killed by [^,]*, shutting down', style = "red bold" },
  { regex = 'identified spam ([^ ]*) for ([^ ]*) in ([^ ]*) seconds, ([^ ]*) bytes.', group = 1, style = "yellow bold" },
  { regex = 'identified spam ([^ ]*) for ([^ ]*) in ([^ ]*) seconds, ([^ ]*) bytes.', group = 2, style = "yellow bold" },
  { regex = 'identified spam ([^ ]*) for ([^ ]*) in ([^ ]*) seconds, ([^ ]*) bytes.', group = 3, style = "yellow bold" },
  { regex = 'identified spam ([^ ]*) for ([^ ]*) in ([^ ]*) seconds, ([^ ]*) bytes.', group = 4, style = "yellow bold" },
  { regex = 'identified spam [^ ]* for [^ ]* in [^ ]* seconds, [^ ]* bytes.', style = "yellow" },
  { regex = 'server successfully spawned child process, pid (.*)', group = 1, style = "green bold" },
  { regex = 'server successfully spawned child process, pid', style = "green" },
]

[scheme.clamav]
description = 'clamd logging'
rules = [
  { regex = ':', style = "magenta" },
  { regex = '^... ... [0-9]* ..:..:.. ....', style = "blue" },
  { regex = 'ERROR:(.*)', group = 1, style = "red bold" },
  { regex = 'ERROR:', style = "red" },
  { regex = 'Protecting against ([0-9]*) viruses.', group = 1, style = "green bold" },
  { regex = 'Protecting against [0-9]* viruses.', style = "green" },
  { regex = 'Exiting.*', style = "red bg:black reverse" },
  { regex = '^(.*): Unable to open file or directory ERROR', group = 1, style = "yellow bold" },
  { regex = '^.*: Unable to open file or directory ERROR', style = "yellow" },
  { regex = 'LOGGING DISABLED.*', style = "red bg:black reverse" },
]

[scheme.samba]
paths = ['/var/log/samba/']
rules = [
  { regex = '^.([0-9]*/[0-9]*/[0-9]* [0-9]*:[0-9]*:[0-9]*, [0-9]*)', group = 1, style = "blue" },
  { regex = '\.', style = "blue" },
  { regex = '^ *([^ ]*).*(connect to service folkert initially as user [^ ]*)', group = 1, style = "green" },
  { regex = '^ *([^ ]*).*(connect to service folkert initially as user [^ ]*)', group = 2, style = "green" },
  { regex = 'closed connection to service.*', style = "yellow" },
  { regex = 'Error =.*', style = "red" },
  { regex = 'ERRNO =.*', style = "red" },
  { regex = '^.*does not exist or is not a directory, when connecting to.*', style = "red" },
  { regex = 'Ignoring unknown parameter.*', style = "red" },
  { regex = 'smbd version.*started.', style = "green bold" },
  { regex = 'Netbios nameserver version.*started.', style = "green bold" },
  { regex = 'Samba name server.*is now a local master browser for workgroup.*on subnet.*', style = "green" },
  { regex = 'Attempting to become domain master browser on workgroup.*, subnet.*', style = "yellow" },
  { regex = 'Samba is now a logon server for workgroup.*on subnet.*', style = "green" },
  { regex = 'Server.*at IP.*is announcing itself as a local master browser for workgroup.*and we think we are master. Forcing election.', style = "yellow bold" },
]

[scheme.audit]
rules = [
  { regex = ':', style = "cyan" },
  { regex = '^... .. ..:..:..', style = "blue" },
  { regex = 'Illegal user.*', style = "red" },
  { regex = 'session opened for user.*', style = "green" },
  { regex = 'Accepted publickey for', style = "green" },
  { regex = 'Did not receive identification string from.*', style = "yellow" },
]

[scheme.exim]
paths = ['/var/log/mail/']
rules = [
  { regex = ':', style = "cyan" },
  { regex = '^....-..-.. ..:..:..', style = "blue" },
  { regex = '<=', style = "magenta bold" },
  { regex = '=>', style = "magenta bold" },
  { regex = '=> *[^ ]*', style = "green bold" },
  { regex = '<= *[^ ]*', style = "green" },
  { regex = '=> *[^ ]* <[^>]*>', style = "green bold" },
  { regex = '<= *[^ ]* <[^>]*>', style = "green" },
  { regex = 'H=[^ ]*', style = "yellow" },
  { regex = 'verify failed for SMTP recipient.*', style = "red" },
  { regex = ' *[^ ]* \[[0-9\.:]*\]: Connection refused', style = "red" },
  { regex = 'SMTP.*timeout.*', style = "red" },
  { regex = 'Spool file is locked (another process is handling this message)', style = "yellow" },
]

[scheme.httping]
description = 'ping for HTTP'
rules = [
  { regex = '^PING .*:', style = "green" },
  { regex = 'time=[0-9\.]* ms', style = "magenta" },
  { regex = 'seq=[0-9]*', style = "yellow" },
  { regex = '^---.*', style = "green" },
  { regex = '^([0-9]*) connects, ([0-9]*) ok, ([^%]*)', group = 1, style = "green" },
  { regex = '^([0-9]*) connects, ([0-9]*) ok, ([^%]*)', group = 2, style = "green" },
  { regex = '^([0-9]*) connects, ([0-9]*) ok, ([^%]*)', group = 3, style = "green" },
  { regex = '^round-trip.*= ([0-9\.]*)/([0-9\.]*)/([0-9\.]*)', group = 1, style = "green" },
  { regex = '^round-trip.*= ([0-9\.]*)/([0-9\.]*)/([0-9\.]*)', group = 2, style = "green" },
  { regex = '^round-trip.*= ([0-9\.]*)/([0-9\.]*)/([0-9\.]*)', group = 3, style = "green" },
  { regex = '404 Not Found', style = "red" },
  { regex = '[0-9]*KB/s', style = "blue" },
  { regex = 'could not connect', style = "red" },
]

[scheme.netstat]
description = 'see www.vanheusden.com/multitail/examples.html'
rules = [
  { regex = 'ESTABLISHED', style = "green" },
  { regex = 'SYN_SENT', style = "yellow" },
  { regex = 'CLOSE_WAIT', style = "magenta" },
  { regex = 'FIN_WAIT1', style = "blue" },
  { regex = 'FIN_WAIT2', style = "blue underline" },
  { regex = ':([^ ]*)', group = 1, style = "red" },
  { regex = '^[^ ]*', style = "cyan" },
]

[scheme.tcpdump]
rules = [
  { regex = '^[^ ]*', style = "blue" },
  { regex = ':', style = "magenta" },
  { regex = '^[^ ]* [^ ]* *[^ ]* > [^:]*: *([^ ]*)', group = 1, style = "red" },
  { regex = '^[^ ]* [^ ]* *[^ ]*\.([^ ]*) > [^ ]*\.([^:]*):', group = 1, style = "green" },
  { regex = '^[^ ]* [^ ]* *[^ ]*\.([^ ]*) > [^ ]*\.([^:]*):', group = 2, style = "green" },
  { regex = '\.', style = "magenta" },
  { regex = ' IP (.*) > .*:', group = 1, style = "yellow" },
  { regex = ' IP [^ ]* > ([^:]*):', group = 1, style = "yellow bold" },
]

[scheme.dhcpd]
rules = [
  { regex = ':', style = "magenta" },
  { regex = '^... .. ..:..:..', style = "blue" },
  { regex = 'DHCPACK', style = "green bold" },
  { regex = 'DHCPACK on ([^ ]*) to ([^ ]*) to (.*)', group = 1, style = "green" },
  { regex = 'DHCPACK on ([^ ]*) to ([^ ]*) to (.*)', group = 2, style = "green" },
  { regex = 'DHCPACK on ([^ ]*) to ([^ ]*) to (.*)', group = 3, style = "green" },
  { regex = 'DHCPINFORM from ([^ ]*) via', group = 1, style = "red bold" },
  { regex = 'DHCPINFORM from.*via.*not authoritative for subnet.*', style = "red" },
  { regex = 'DHCPDECLINE of ([^ ]*) from ([^ ]*) via', group = 1, style = "yellow bold" },
  { regex = 'DHCPDECLINE of ([^ ]*) from ([^ ]*) via', group = 2, style = "yellow bold" },
  { regex = 'DHCPDECLINE of.*from.*via.*', style = "yellow" },
  { regex = 'DHCPNAK', style = "cyan" },
]

[scheme.bind]
rules = [
  { regex = ':', style = "magenta" },
  { regex = '^... .. ..:..:..', style = "blue" },
  { regex = 'lame server resolving ([^ ]*).*in ([^?]*).*: (.*$)', group = 1, style = "yellow bold" },
  { regex = 'lame server resolving ([^ ]*).*in ([^?]*).*: (.*$)', group = 2, style = "yellow bold" },
  { regex = 'lame server resolving ([^ ]*).*in ([^?]*).*: (.*$)', group = 3, style = "yellow bold" },
  { regex = 'lame server resolving [^ ]* .in [^:]*..:', style = "yellow" },
  { regex = 'client ([^#]*)#[0-9]*: update forwarding denied', group = 1, style = "red bold" },
  { regex = 'client [^:]*: update forwarding denied', style = "red" },
  { regex = 'received notify for zone (.*)', group = 1, style = "cyan bold" },
  { regex = 'received notify for zone', style = "cyan" },
  { regex = 'zone [^:]*: transferred serial.*', style = "cyan" },
  { regex = 'zone [^:]*: sending notifies .serial [0-9]*.', style = "cyan" },
  { regex = 'transfer of [^ ]* from ([^#]*)#[0-9]*: end of transfer', group = 1, style = "green bold" },
  { regex = 'transfer of [^ ]* from [^:]*: end of transfer', style = "green" },
  { regex = 'loading configuration from.*', style = "yellow" },
  { regex = 'no IPv6 interfaces found', style = "yellow" },
  { regex = 'logging channel [^ ]* file [^:]*: permission denied', style = "red" },
  { regex = 'isc_log_open [^ ]* failed: permission denied', style = "red" },
  { regex = 'zone [^:]*: loading master file [^:]*: file not found', style = "red" },
  { regex = 'named reload succeeded', style = "green bold" },
]

[scheme.smartd]
rules = [
  { regex = 'Device: [^,]*, SMART Usage Attribute: [0-9]* ([^ ]*) changed from [0-9]* to (.*)', group = 1, style = "red bold" },
  { regex = 'Device: [^,]*, SMART Usage Attribute: [0-9]* ([^ ]*) changed from [0-9]* to (.*)', group = 2, style = "red bold" },
  { regex = 'Device: [^,]*, SMART Usage Attribute: [0-9]* [^ ]* changed from [0-9]* to.*', style = "red" },
]

[scheme.kerberos]
rules = [
  { regex = ':', style = "magenta" },
  { regex = '^... [0-9]* ..:..:..', style = "blue" },
  { regex = 'klogind.*: Authentication failed from ([^:]*): Software caused connection abort', group = 1, style = "yellow bold" },
  { regex = 'klogind.*: Authentication failed from [^:]*: Software caused connection abort', style = "yellow" },
  { regex = 'klogind.*: Kerberos authentication failed', style = "red" },
  { regex = 'klogind.*: User ([^ ]*) is not authorized to login to account(.*)', style = "red bold" },
  { regex = 'klogind.*: User [^ ]* is not authorized to login to account.*', style = "red" },
  { regex = 'ksu.*:.*authentication failed for ([^ ]*) on', group = 1, style = "red bold" },
  { regex = 'ksu.*:.*authentication failed for [^ ]* on.*', style = "red" },
  { regex = 'commencing operation', style = "green" },
  { regex = 'AS_REQ [^}]*}, ([^ ]*) for (.*)', group = 1, style = "bold" },
  { regex = 'AS_REQ [^}]*}, ([^ ]*) for (.*)', group = 2, style = "bold" },
  { regex = 'Ticket expired', style = "magenta" },
  { regex = 'Client not found in Kerberos database', style = "red" },
]

[scheme.oracle]
rules = [
  { regex = '^ORA-0*600.*', style = "red bold" },
  { regex = '^ORA-0*7445.*', style = "red bold" },
  { regex = '^ORA-([^:]*):', group = 1, style = "yellow" },
]

[scheme.ntpd]
rules = [
  { regex = ':', style = "magenta" },
  { regex = '^... .. ..:..:..', style = "blue" },
  { regex = 'configure: keyword "([^"]*)" unknown, line ignored', group = 1, style = "red bold" },
  { regex = 'configure: keyword "([^"]*)" unknown, line ignored', style = "red" },
  { regex = 'ntpd\[.*\]: ntpd exiting on signal.*', style = "yellow bold" },
  { regex = 'ntpd\[.*\]: ntpd [^e].*', style = "green bold" },
  { regex = 'synchronized to ([^,]*)', group = 1, style = "green bold" },
  { regex = 'synchronized to.*', style = "green" },
  { regex = 'check receiver configuration / cableling', style = "red" },
]

[scheme.websphere]
description = 'WebSphere error-log'
rules = [
  { regex = ':', style = "magenta" },
  { regex = '/', style = "magenta" },
  { regex = '\.', style = "blue bold" },
  { regex = '^.[0-9]*/[0-9]*/[0-9]* *[0-9]*:..:..:[0-9]* [^ ]*', style = "blue" },
  { regex = '^.*\(([^:\)]*)', group = 1, style = "yellow" },
  { regex = 'Reason:.*', style = "red" },
  { regex = 'Unable to', style = "red bold" },
  { regex = 'Unable to(.*)', group = 1, style = "red" },
  { regex = 'Failed to', style = "red bold" },
  { regex = 'Failed to(.*)', group = 1, style = "red" },
  { regex = '^[^ ]* *[^ ]* *[^ ]* *[^ ]* *([^ ]*)', group = 1, style = "green" },
  { regex = '^[^ ]* *[^ ]* *[^ ]* *[^ ]* *[^ ]* *( F )', group = 1, style = "red bold" },
  { regex = '^[^ ]* *[^ ]* *[^ ]* *[^ ]* *[^ ]* *( E )', group = 1, style = "red" },
  { regex = '^[^ ]* *[^ ]* *[^ ]* *[^ ]* *[^ ]* *( W )', group = 1, style = "yellow bold" },
  { regex = '^[^ ]* *[^ ]* *[^ ]* *[^ ]* *[^ ]* *( A )', group = 1, style = "yellow" },
  { regex = '^[^ ]* *[^ ]* *[^ ]* *[^ ]* *[^ ]* *(I)', group = 1, style = "green bold" },
  { regex = '^[^ ]* *[^ ]* *[^ ]* *[^ ]* *[^ ]* *( C )', group = 1, style = "green" },
  { regex = '^[^ ]* *[^ ]* *[^ ]* *[^ ]* *[^ ]* *( R )', group = 1, style = "magenta bold" },
  { regex = '^[^ ]* *[^ ]* *[^ ]* *[^ ]* *[^ ]* *( O )', group = 1, style = "magenta" },
  { regex = '^[^ ]* *[^ ]* *[^ ]* *[^ ]* *[^ ]* *( Z )', group = 1, style = "red bold" },
  { regex = 'Next Linked Exception:', style = "yellow" },
  { regex = 'Queue manager security exit rejected connection with error code [0-9]*', style = "magenta bold" },
  { regex = 'com.ibm.mq.MQException: [^:]*: An MQException occurred: Completion Code [0-9]*, Reason [0-9]*', style = "red bold" },
  { regex = 'Begin backtrace for nested exception', style = "yellow" },
  { regex = 'Socket connection attempt refused', style = "yellow" },
  { regex = 'Other data:', style = "yellow" },
  { regex = 'Exception data follows:', style = "yellow" },
  { regex = 'Target name: .*', style = "green" },
]

[scheme.procmail]
paths = ['procmail.log']
rules = [
  { regex = ':', style = "magenta" },
  { regex = '/', style = "magenta" },
  { regex = '^procmail: \[[0-9]*\] ([^ ]* [^ ]* *[^ ]* ..:..:.. [^ ]*)', group = 1, style = "blue bold" },
  { regex = '^procmail: \[[0-9]*\] [^ ]* [^ ]* *[^ ]* ..:..:.. [^ ]*', style = "blue" },
  { regex = '^procmail: Match on "(.*)"', group = 1, style = "green bold" },
  { regex = '^procmail: Match on.*', style = "green" },
  { regex = '^procmail: Executing.*', style = "red" },
  { regex = '^procmail: Assigning', style = "magenta bold" },
  { regex = 'warning:.*', style = "yellow" },
  { regex = '''Couldn't determine implicit lockfile from.*''', style = "yellow" },
]

[scheme.checkpoint]
description = 'Checkpoint Firewall-1'
rules = [
  { regex = ':', style = "magenta" },
  { regex = '^[0-9]*:[0-9]*:[0-9]*', style = "blue" },
  { regex = '^..:..:.. *drop', style = "red bold" },
  { regex = '^..:..:.. *drop.*(service: *[^;]*)', group = 1, style = "red bold" },
  { regex = '^..:..:.. *accept', style = "green" },
  { regex = '^..:..:.. *reject', style = "yellow bold" },
  { regex = '^..:..:.. *reject.*(service: *[^;]*)', group = 1, style = "yellow bold" },
  { regex = 'rule: *[^;]*', style = "green bold" },
  { regex = 'service: *[^;]*', style = "yellow" },
  { regex = 'src: *[^;]*', style = "magenta" },
  { regex = 'dst: *[^;]*', style = "magenta bold" },
  { regex = '>[^ ]*', style = "blue bold" },
]

[scheme.pppd]
description = 'PPP daemon'
rules = [
  { regex = ':', style = "magenta" },
  { regex = '^... .. ..:..:..', style = "blue" },
  { regex = 'Hangup(.*)', group = 1, style = "red bold" },
  { regex = 'Hangup', style = "red" },
  { regex = 'Terminating on signal(.*)', group = 1, style = "yellow bold" },
  { regex = 'Terminating on signal.*', style = "yellow" },
  { regex = 'Connect time ([^ ]*) minutes.', group = 1, style = "green bold" },
  { regex = 'Connect time [^ ]* minutes.', style = "green" },
  { regex = 'Sent ([0-9]*) bytes, received ([0-9]*) bytes.', group = 1, style = "magenta bold" },
  { regex = 'Sent ([0-9]*) bytes, received ([0-9]*) bytes.', group = 2, style = "magenta bold" },
  { regex = 'Sent [0-9]* bytes, received [0-9]* bytes.', style = "magenta" },
  { regex = 'pppd [^ ]* started by [^,]*, uid [0-9]*', style = "green" },
  { regex = 'Using interface (.*)', group = 1, style = "blue bold" },
  { regex = 'Using interface.*', style = "blue" },
  { regex = 'local *IP address (.*)', group = 1, style = "green bold" },
  { regex = 'local *IP address.*', style = "green" },
  { regex = '''Couldn't detach (fork failed:.*)''', style = "red bg:black reverse" },
  { regex = 'Unsupported protocol (.*) received', group = 1, style = "yellow bold" },
  { regex = 'Unsupported protocol .* received', style = "yellow bg:black reverse" },
  { regex = 'Peer not responding', style = "yellow bold" },
  { regex = 'DNS address.*', style = "reverse" },
]

[scheme.netscapeldap]
description = 'Netscape Directory server (LDAP)'
rules = [
  { regex = ':', style = "magenta" },
  { regex = '/', style = "magenta" },
  { regex = '^.../.../....:..:..:.. ......', style = "blue" },
  { regex = 'Netscape-Directory.*starting up', style = "green" },
  { regex = 'All database threads now stopped', style = "yellow" },
  { regex = 'Backing up file.*', style = "green" },
  { regex = 'Detected Disorderly Shutdown last time Directory Server was running, recovering database.', style = "red" },
  { regex = 'Entry ([^ ]*) unknown object class ([^ ]*)', group = 1, style = "yellow bold" },
  { regex = 'Entry ([^ ]*) unknown object class ([^ ]*)', group = 2, style = "yellow bold" },
  { regex = 'Entry [^ ]* unknown object class [^ ]*', style = "yellow" },
  { regex = 'Shutting down due to possible conflicts with other slapd processes', style = "red bold" },
  { regex = 'Unable to start slapd because it is already running as process ([0-9]*)', style = "red bold" },
  { regex = 'Unable to start slapd because it is already running as process [0-9]*', style = "red bold" },
  { regex = 'slapd got [^ ]* signal', style = "yellow" },
]

[scheme.vmstat]
description = 'vmstat is part of sysstat'
rules = [
  { regex = '^(procs)', group = 1, style = "magenta" },
  { regex = '^procs *(-*memory-*)', group = 1, style = "red" },
  { regex = '^procs *-*memory-* *(-*swap-*)', group = 1, style = "green" },
  { regex = '^procs *-*memory-* *-*swap-* *(-*io-*)', group = 1, style = "yellow" },
  { regex = '^procs *-*memory-* *-*swap-* *-*io-* *(-*system-*)', group = 1, style = "blue" },
  { regex = '^ *(r *b)', group = 1, style = "magenta bold" },
  { regex = '^ *r *b *(swpd *free *buff *cache)', group = 1, style = "red bold" },
  { regex = '^ *r *b *swpd *free *buff *cache *(si *so)', group = 1, style = "green bold" },
  { regex = '^ *r *b *swpd *free *buff *cache *si *so *(bi *bo)', group = 1, style = "yellow bold" },
  { regex = '^ *r *b *swpd *free *buff *cache *si *so *bi *bo *(in *cs)', group = 1, style = "blue bold" },
  { regex = '^ *r *b *swpd *free *buff *cache *si *so *bi *bo *in *cs *(us *sy *id *wa)', group = 1, style = "bold" },
]

[scheme.mpstat]
description = 'mpstat is part of systat'
rules = [
  { regex = ':', style = "magenta" },
  { regex = '^..:..:.. ..', style = "blue" },
  { regex = 'CPU.*', style = "blue bold" },
]

[scheme.log4j]
rules = [
  { regex = ':', style = "magenta" },
  { regex = '/', style = "magenta" },
  { regex = '^[0-9]*-[0-9]*-[0-9]* [0-9]*:[0-9]*:[0-9]*,[0-9]*', style = "blue" },
  { regex = '^[^ ]* *[^,]*,[^ ]* *[0-9]* *(DEBUG) *[^ ]* [^ ]* *(.*)$', group = 1, style = "blue bold" },
  { regex = '^[^ ]* *[^,]*,[^ ]* *[0-9]* *(DEBUG) *[^ ]* [^ ]* *(.*)$', group = 2, style = "blue bold" },
  { regex = '^[^ ]* *[^,]*,[0-9]* *[0-9]* *(INFO) *[^ ]* [^ ]* *(.*)$', group = 1, style = "green" },
  { regex = '^[^ ]* *[^,]*,[0-9]* *[0-9]* *(INFO) *[^ ]* [^ ]* *(.*)$', group = 2, style = "green" },
  { regex = '^[^ ]* *[^,]*,[0-9]* *[0-9]* *(WARN) *[^ ]* [^ ]* *(.*)$', group = 1, style = "yellow" },
  { regex = '^[^ ]* *[^,]*,[0-9]* *[0-9]* *(WARN) *[^ ]* [^ ]* *(.*)$', group = 2, style = "yellow" },
  { regex = '^[^ ]* *[^,]*,[0-9]* *[0-9]* *(ERROR) *[^ ]* [^ ]* *(.*)$', group = 1, style = "red" },
  { regex = '^[^ ]* *[^,]*,[0-9]* *[0-9]* *(ERROR) *[^ ]* [^ ]* *(.*)$', group = 2, style = "red" },
  { regex = '^[^ ]* *[^,]*,[0-9]* *[0-9]* *(FATAL) *[^ ]* [^ ]* *(.*)$', group = 1, style = "red bold" },
  { regex = '^[^ ]* *[^,]*,[0-9]* *[0-9]* *(FATAL) *[^ ]* [^ ]* *(.*)$', group = 2, style = "red bold" },
  { regex = '^[^ ]* *[^,]*,[0-9]* *[0-9]* *[A-Z]* *(.*)', group = 1, style = "white bold" },
]

[scheme.log4jnew]
rules = [
  { regex = 'ERROR', style = "red bg:yellow bold" },
  { regex = 'FATAL', style = "red bg:yellow bold" },
  { regex = 'INFO', style = "yellow" },
  { regex = 'WARN', style = "green" },
  { regex = '([0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2},[0-9]{3})', group = 1, style = "yellow" },
  { regex = ' (\[.*\])', group = 1, style = "cyan" },
  { regex = '[INFO|WARNING|ERROR|DEBUG|FATAL]\ ([a-zA-Z0-9\.]*)\  ', style = "cyan" },
  { regex = ' ([0-9]{2,})', style = "magenta" },
  { regex = '(UNKNOWN|localhost|handling) ', group = 1, style = "green" },
]

[scheme.p0f]
description = 'p0f http://lcamtuf.coredump.cx/p0f.shtml'
rules = [
  { regex = ':', style = "magenta" },
  { regex = '^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}', style = "blue bold" },
  { regex = '^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}:([0-9]*)', group = 1, style = "blue" },
  { regex = '^[^ ]* - ([^(]*)', group = 1, style = "yellow" },
  { regex = '\(older, [0-9]*\)', style = "green" },
  { regex = '\(newer, [0-9]*\)', style = "green bold" },
  { regex = '\(up: .*\)', style = "red" },
  { regex = 'distance [0-9]*', style = "red bold" },
  { regex = '^  -> [^:]*:([0-9]*)', group = 1, style = "cyan" },
  { regex = '^>> Masquerade at ([^:]*):', group = 1, style = "white" },
  { regex = '^>> Masquerade at [^:]*:', style = "white bold" },
]

[scheme.portsentry]
description = 'http://sourceforge.net/projects/sentrytools/'
rules = [
  { regex = ':', style = "magenta" },
  { regex = 'attackalert: ([^/]*)/Normal scan from host: ([^/]*)/([0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}) to TCP port: ([0-9]*)', group = 1, style = "red bold" },
  { regex = 'attackalert: ([^/]*)/Normal scan from host: ([^/]*)/([0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}) to TCP port: ([0-9]*)', group = 2, style = "red bold" },
  { regex = 'attackalert: ([^/]*)/Normal scan from host: ([^/]*)/([0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}) to TCP port: ([0-9]*)', group = 3, style = "red bold" },
  { regex = 'attackalert: ([^/]*)/Normal scan from host: ([^/]*)/([0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}) to TCP port: ([0-9]*)', group = 4, style = "red bold" },
  { regex = 'attackalert: [^/]*/Normal scan from host: [^/]*/[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3} to TCP port: [0-9]*', style = "red" },
  { regex = 'attackalert: ERROR: cannot open ignore file. Blocking host anyway.', style = "cyan" },
  { regex = 'attackalert: Host: ([^/]*)/([^ ]*) is already blocked Ignoring', group = 1, style = "yellow bold" },
  { regex = 'attackalert: Host: ([^/]*)/([^ ]*) is already blocked Ignoring', group = 2, style = "yellow bold" },
  { regex = 'attackalert: Host: [^ ]* is already blocked Ignoring', style = "yellow" },
]

[scheme.strace]
description = 'strace is the truss of Linux'
rules = [
  { regex = '/\*.*\*/', style = "blue" },
  { regex = '^[a-z_]*[0-9]*', style = "yellow" },
  { regex = '^[a-z_]*[0-9]*(\()[^)]*(\))', group = 1, style = "yellow" },
  { regex = '^[a-z_]*[0-9]*(\()[^)]*(\))', group = 2, style = "yellow" },
  { regex = '^[a-z]*\([^)]*\).*(\(.*\))', group = 1, style = "blue" },
  { regex = '^.*(= *-*[a-fx0-9]*)[^=]*$', group = 1, style = "green" },
  { regex = '^.*= *-*[a-fx0-9]* *([A-Z]*)[^=]*$', group = 1, style = "cyan" },
  { regex = '\\[a-z]', style = "magenta" },
  { regex = '\\[0-9]*', style = "magenta" },
  { regex = '"[^"]*"', style = "red" },
  { regex = '[a-z]*=', style = "white" },
  { regex = '[a-z0-9_]*:', style = "white" },
  { regex = '[0-9a-fx]*', style = "red" },
  { regex = '[A-Z_]*', style = "cyan" },
  { regex = '[\[\]]*', style = "yellow" },
]

[scheme.argus]
description = 'Argus http://qosient.com/argus/'
rules = [
  { regex = '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\.([0-9]+).*[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\.([0-9]+)', group = 1, style = "bold" },
  { regex = '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\.([0-9]+).*[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\.([0-9]+)', group = 2, style = "bold" },
  { regex = ' (<->)', group = 1, style = "magenta bold" },
  { regex = ' (<[-?])', group = 1, style = "cyan bold" },
  { regex = ' ([-?]>)', group = 1, style = "yellow bold" },
  { regex = '.*tcp.*', style = "bg:blue" },
  { regex = '.*udp.*', style = "bg:green" },
  { regex = '.*icmp.*', style = "bg:cyan" },
  { regex = '.*man.*', style = "reverse" },
]

[scheme.snort]
description = 'Intrusion detector'
paths = ['/var/log/snort/alert']
rules = [
  { regex = '.*Priority: 3.*', style = "green" },
  { regex = '.*Priority: 2.*', style = "yellow" },
  { regex = '.*Priority: 1.*', style = "red" },
]

[scheme.errpt]
description = 'AIX error reporting tool'
rules = [
  { regex = '^[^ ]* *(....)....(..)', group = 1, style = "blue" },
  { regex = '^[^ ]* *(....)....(..)', group = 2, style = "blue" },
  { regex = '^[^ ]* *....(....)..', group = 1, style = "blue bold" },
  { regex = ' I [A-Z] .*', style = "magenta" },
  { regex = ' T [A-Z] .*', style = "yellow" },
  { regex = ' [A-Z] H .*', style = "red" },
]

[scheme.mysql]
description = 'MySQL error log'
rules = [
  { regex = ':', style = "magenta" },
  { regex = '^..(..).. ..:..:..', group = 1, style = "blue" },
  { regex = '^(..)..(..) ..:..:..', group = 1, style = "blue bold" },
  { regex = '^(..)..(..) ..:..:..', group = 2, style = "blue bold" },
  { regex = '^...... ..:..:..', style = "blue" },
  { regex = '^...... ..:..:.. \[ERROR\]', style = "red bold" },
  { regex = '^...... ..:..:.. \[ERROR\].*', style = "red" },
  { regex = '^...... ..:..:.. \[Warning\]', style = "yellow bold" },
  { regex = '^...... ..:..:.. \[Warning\].*', style = "yellow" },
  { regex = '^...... ..:..:.. \[Note\]', style = "green bold" },
  { regex = '^...... ..:..:.. \[Note\].*', style = "green" },
  { regex = 'mysqld ended', style = "magenta" },
  { regex = '''Can't start server.*''', style = "red" },
]

[scheme.acpitail]
description = 'Show temperature/battery/etc info'
rules = [
  { regex = ':', style = "magenta" },
  { regex = '-', style = "magenta" },
  { regex = '... ... [0-9]* ..:..:.. 2...', style = "blue" },
  { regex = 'error.*', style = "red" },
]

[scheme.qmt-clamd]
paths = ['/var/log/qmail/clamd/current']
rules = [
  { regex = '^....-..-.. ..:..:..', style = "blue bold" },
  { regex = 'ERROR:', style = "red" },
  { regex = 'Protecting against ([0-9]*) viruses.', group = 1, style = "green bold" },
  { regex = 'Protecting against [0-9]* viruses.', style = "green" },
  { regex = 'Exiting.*', style = "red bg:black reverse" },
  { regex = '^(.*): Unable to open file or directory ERROR', group = 1, style = "red bold" },
  { regex = '^.*: Unable to open file or directory ERROR', style = "red" },
  { regex = 'LOGGING DISABLED.*', style = "red bg:black reverse" },
  { regex = '(: OK)', style = "cyan" },
  { regex = '/var/qmail/simscan/.*(: [^ ]* FOUND)', style = "magenta" },
  { regex = ' LibClamAV Warning.*', style = "yellow" },
]

[scheme.qmt-smtp]
paths = ['/var/log/qmail/smtp/current', '/var/log/qmail/submission/current']
rules = [
  { regex = '^....-..-.. ..:..:..', style = "blue bold" },
  { regex = 'verify failed for SMTP recipient.*', style = "red" },
  { regex = ' *[^ ]* \[[0-9\.:]*\]: Connection refused', style = "red" },
  { regex = ' *[^ ]*policy_check: policy_load failed', style = "red bold" },
  { regex = ' *[^ ]*CLEAN ([^ ]*).*', style = "white bold" },
  { regex = ' *[^ ]*policy_check: policy allows([^ ]*).*', style = "white bold" },
  { regex = ' *[^ ]*RELAYCLIENT:([^ ]*).*', style = "white bold" },
  { regex = ' *[^ ]*policy_check: policy forbid([^ ]*).*', style = "magenta" },
  { regex = 'rblsmtpd: ([0-9\.]*).*', style = "magenta" },
  { regex = 'qmail-smtpd.*', style = "magenta" },
  { regex = 'spf-reject.*', style = "magenta" },
  { regex = ' *[^ ]*CHKUSER rejected intrusion: ([^ ]*).*', style = "magenta" },
  { regex = ' *[^ ]*CHKUSER rejected relaying: ([^ ]*).*', style = "magenta" },
  { regex = ' *[^ ]*CHKUSER rejected rcpt: ([^ ]*).*', style = "magenta" },
  { regex = ' *[^ ]*SPAM REJECT ([^ ]*).*', style = "magenta bold" },
  { regex = ' *[^ ]*:VIRUS:.*', style = "magenta bold" },
  { regex = ' *[^ ]*:ATTACH:.*', style = "magenta bold" },
]

[scheme.qmt-send]
paths = ['/var/log/qmail/send/current']
rules = [
  { regex = '^....-..-.. ..:..:..', style = "blue" },
  { regex = 'starting delivery ([0-9]*)', style = "white bold" },
  { regex = 'delivery *[^ ]*: success:.*', style = "white bold" },
  { regex = 'delivery *[^ ]*: failure:.*', style = "red bold" },
  { regex = 'delivery *[^ ]*: deferral:.*', style = "yellow bold" },
]

[scheme.qmt-spamassassin]
paths = ['/var/log/qmail/spam/current']
rules = [
  { regex = '^....-..-.. ..:..:..', style = "blue bold" },
  { regex = 'clean message ([^ ]*) for ([^ ]*) in ([^ ]*) seconds, ([^ ]*) bytes.', group = 1, style = "cyan bold" },
  { regex = 'clean message ([^ ]*) for ([^ ]*) in ([^ ]*) seconds, ([^ ]*) bytes.', group = 2, style = "cyan bold" },
  { regex = 'clean message ([^ ]*) for ([^ ]*) in ([^ ]*) seconds, ([^ ]*) bytes.', group = 3, style = "cyan bold" },
  { regex = 'clean message ([^ ]*) for ([^ ]*) in ([^ ]*) seconds, ([^ ]*) bytes.', group = 4, style = "cyan bold" },
  { regex = 'info: spamd: identified spam.*', style = "magenta bold" },
  { regex = 'info: spamd: result: Y ([^ ]*) -.*', group = 1, style = "magenta bold" },
  { regex = 'autolearn=failed', style = "yellow" },
  { regex = 'server killed by [^,]*, shutting down', style = "red bold" },
  { regex = 'server successfully spawned child process, pid (.*)', group = 1, style = "green bold" },
  { regex = 'server successfully spawned child process, pid', style = "green" },
  { regex = ' warn.*', style = "yellow" },
  { regex = 'info: spamd: processing message.*', style = "white bold" },
]

[scheme.qmt-sophie]
paths = ['/var/log/qmail/sophie/current']
rules = [
  { regex = '^....-..-.. ..:..:..', style = "blue bold" },
  { regex = 'NOTICE *[^ ]*:.*', style = "white bold" },
  { regex = 'Virus present.*', style = "yellow bold" },
  { regex = 'WARNING *[^ ]*: Scan result =.*', style = "magenta bold" },
  { regex = 'WARNING *[^ ]*: error:.*', style = "red bold" },
]

[scheme.honeypots]
description = 'honeypots logs https://github.com/qeeqbox/honeypots'
paths = ['/var/log/honeypots/']
rules = [
  { regex = '"action": "(process)"', group = 1, style = "green" },
  { regex = '"action": "([^"]+)"', group = 1, style = "yellow bold" },
  { regex = '"dest_port": "([0-9]+)"', group = 1, style = "blue bold" },
  { regex = '"server": "([^"]+)"', group = 1, style = "blue bold" },
  { regex = '"src_ip": "([^"]+)"', group = 1, style = "magenta bold" },
  { regex = 'error', style = "red" },
  { regex = '"error": "([^"]+)"', group = 1, style = "red bold" },
  { regex = '"uri": "([^"]+)"', group = 1, style = "white bg:cyan bold" },
]

[scheme.f2b]
description = 'Fail2ban logs'
paths = ['/var/log/fail2ban.log']
rules = [
  { regex = '\[([A-Za-z\-]+)\]', group = 1, style = "magenta bold" },
  { regex = '[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}', style = "yellow bold" },
  { regex = '[0-9]{2}:[0-9]{2}:[0-9]{2}', style = "white underline bold" },
  { regex = '(\[)[A-Za-z]', group = 1, style = "blue" },
  { regex = '[A-Za-z](\])', group = 1, style = "blue" },
  { regex = 'already banned', style = "red" },
  { regex = 'INFO|NOTICE', style = "cyan" },
  { regex = 'WARNING', style = "yellow" },
  { regex = 'ERROR|FAIL[^ ]+', style = "red" },
  { regex = '''ail[[:space:]]+'(.+)'''', group = 1, style = "magenta" },
  { regex = 'started|reloaded', style = "green" },
  { regex = 'stopped', style = "red" },
  { regex = '(log(P|p)ath|log(e|E)ncoding|journal(m|M)atch|ignore(i|I)p|ignore(c|C)ommand|fail(r|R)egex|ignore(r|R)egex|find(t|T)ime|ban(t|T)ime|date(p|P)attern|use(d|D)ns|max(r|R)etry|max(l|L)ines|actions|encoding):', style = "cyan" },
  { regex = ' Unban', style = "green" },
  { regex = ' Ban', style = "red" },
  { regex = ''''(\/[^']+)'''', group = 1, style = "blue" },
]

[scheme.openhab]
paths = ['/var/log/openhab2/']
rules = [
  { regex = '(ERROR|FATAL)', style = "red bold" },
  { regex = 'WARN', style = "yellow bold" },
  { regex = 'INFO', style = "green bold" },
  { regex = 'TRACE', style = "black bg:green bold" },
  { regex = 'DEBUG', style = "black bg:yellow bold" },
  { regex = '([0-9]{4}-[0-9]{2}-[0-9]{2}\ [0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3})', group = 1, style = "bold" },
  { regex = ' \[.*\.(\w*?)\s?\]', group = 1, style = "cyan" },
  { regex = ' \[(\w*?)\s*\]', group = 1, style = "cyan bold" },
  { regex = ' (\[.*?\]).', group = 1, style = "blue bold" },
  { regex = '[INFO|WARNING|ERROR|DEBUG|FATAL]\ ([a-zA-Z0-9\.]*)\..', style = "cyan" },
  { regex = '[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}(:[0-9]{1,5})+', style = "yellow" },
  { regex = '(\b|-)([0-9]{1,})(\.[0-9]*)?\b', style = "magenta" },
  { regex = ' (UNDEF|NULL)', style = "red bold" },
  { regex = ' (ON|OPEN|ONLINE|PLAY)', style = "green bold" },
  { regex = ' (OFF|CLOSED|OFFLINE|PAUSE)', style = "yellow bold" },
  { regex = ' received command (.*?).?', group = 1, style = "magenta bold" },
  { regex = ' changed from (.*) to ([^ ]*?)', group = 1, style = "magenta bold" },
  { regex = ' changed from (.*) to ([^ ]*?)', group = 2, style = "magenta bold" },
  { regex = ' - (.*) changed from', group = 1, style = "yellow" },
  { regex = ' through (.*)', group = 1, style = "yellow" },
  { regex = ''' Item '(.*)'''', group = 1, style = "yellow" },
  { regex = '\w*?\.(cfg|items|persist|rules|script|sitemap|things|map)', style = "yellow bold" },
  { regex = '''.*'(.*?)'''', group = 1, style = "yellow" },
  { regex = ' (failed|Failed|error|Error|Stopped)', style = "red" },
  { regex = ' (Loading model|Started|Restore\ Values|has\ been\ started|Added\ new\ thing|Connected)', style = "green" },
]

[scheme.proftpd]
paths = ['xferlog']
rules = [
  { regex = '^(\w{3}\ \w{3}\ [0-9]{2}\ [0-9]{2}:[0-9]{2}:[0-9]{2}\ [0-9]{4})', group = 1, style = "white" },
  { regex = '([0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3})', group = 1, style = "magenta" },
  { regex = '(\S*)\ \S*\ \S*\ \S*\ \S*\ \S*\ \S*\ \S*\ \S*\ \S*$', group = 1, style = "white bold" },
  { regex = '(a|b)\ \S*\ \S*\ \S*\ \S*\ \S*\ \S*\ \S*\ \S*$', group = 1, style = "blue bold" },
  { regex = '(_|C|U)\ \S*\ \S*\ \S*\ \S*\ \S*\ \S*\ \S*$', group = 1, style = "yellow bold" },
  { regex = '(i)\ \S*\ \S*\ \S*\ \S*\ \S*\ \S*$', group = 1, style = "red" },
  { regex = '(o)\ \S*\ \S*\ \S*\ \S*\ \S*\ \S*$', group = 1, style = "green" },
  { regex = '(a)\ \S*\ \S*\ \S*\ \S*\ \S*$', group = 1, style = "black bg:red bold" },
  { regex = '(r)\ \S*\ \S*\ \S*\ \S*\ \S*$', group = 1, style = "cyan" },
  { regex = '^\S*\ \S*\ \S*\ \S*\ \S*\ \S*\ \S*\ \S*\ \S*\ \S*\ \S*\ \S*\ \S*\ (\S*)\ \S*\ \S*\ \S*\ \S*', group = 1, style = "cyan bold" },
  { regex = '(\S*)\ \S*\ \S*\ \S*$', group = 1, style = "yellow bold" },
  { regex = '\ (0|1)\ \S*\ \S*$', group = 1, style = "blue bold" },
  { regex = '\ (\S*)\ \S*$', group = 1, style = "cyan" },
  { regex = '(c)$', group = 1, style = "green bold" },
  { regex = '(i)$', group = 1, style = "red bold" },
]

[scheme.kodi]
paths = ['kodi.log']
rules = [
  { regex = '^....-..-..\ ..:..:..\.....', style = "white bold" },
  { regex = 'T:[0-9]*', style = "blue" },
  { regex = '\s(ERROR|error)', style = "red bold" },
  { regex = '\s(WARNING|warning)', style = "yellow bold" },
  { regex = '\s(NOTICE|notice)', style = "green bold" },
  { regex = '(DEBUG|debug)', style = "black bg:yellow bold" },
  { regex = '(INFO|info)', style = "white bold" },
  { regex = 'Opening:', style = "green" },
  { regex = '.*Opening: (.*)', group = 1, style = "yellow underline" },
  { regex = '(CloseFile\(\)|:OnExit\(\))', style = "red" },
