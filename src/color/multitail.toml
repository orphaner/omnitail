[scheme.mqtt]
rules = [
  { regex = '\/?([^\/\ ]*)\/', group = 1, style = "white bold" },
  { regex = '/(\w*).', group = 1, style = "cyan bold" },
  { regex = '/(\$\w*).', group = 1, style = "cyan bold" },
  { regex = '/(set).', group = 1, style = "magenta bold" },
  { regex = '/(\w*)/set', group = 1, style = "cyan bold" },
  { regex = '/', style = "magenta bold" },
  { regex = '/(\$\w*)', group = 1, style = "white bold" },
  { regex = '^(\w|/|\$)*', style = "white" },
  { regex = ' \[.*\.(\w*?)\s?\]', group = 1, style = "white" },
  { regex = '(on|ON|OPEN|ONLINE|Online|true)', style = "green bold" },
  { regex = '(off|OFF|CLOSE|CLOSED)', style = "yellow bold" },
  { regex = '(OFFLINE|Offline|false)', style = "red bold" },
  { regex = ' ([0-9]{1,3}),[0-9]{1,3},[0-9]{1,3}', group = 1, style = "red bold" },
  { regex = ' [0-9]{1,3},([0-9]{1,3}),[0-9]{1,3}', group = 1, style = "green bold" },
  { regex = ' [0-9]{1,3},[0-9]{1,3},([0-9]{1,3})', group = 1, style = "blue bold" },
  { regex = ' [0-9]{1,3},[0-9]{1,3},[0-9]{1,3},([0-9]{1,3})', group = 1, style = "white bold" },
  { regex = ' ([a-zA-Z0-9_,.]*)', group = 1, style = "magenta" },
  { regex = ',("\w*")', group = 1, style = "yellow" },
  { regex = ' ("\w*")', group = 1, style = "yellow" },
  { regex = '\{("\w*")', group = 1, style = "yellow" },
  { regex = '\:("\w*")', group = 1, style = "magenta" },
  { regex = '\:(\w*)', group = 1, style = "magenta" },
  { regex = '\:(".*")', group = 1, style = "magenta" },
]

[scheme.cisco_ios]
